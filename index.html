<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuiRégale ?</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
    --black:#070910;
    --navy:#111a35;
    --gold:#e8ad4a;
    --gold-light:#f5cf82;
    --gold-dark:#b87922;
    --cream:#f5f0e6;
    --gray:#cbd0d8;
    --gray-dark:#8d95a5;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--cream);
    background:
        radial-gradient(circle at 10% 5%,rgba(232,173,74,.11),transparent 28%),
        radial-gradient(circle at 90% 90%,rgba(37,54,105,.30),transparent 35%),
        linear-gradient(135deg,var(--black),var(--navy));
    background-attachment:fixed;
}

/* TRANSITION */

body.page-leaving{
    animation:pageSwipeOut .45s ease forwards;
}

@keyframes pageSwipeOut{
    to{
        opacity:0;
        transform:translateX(-100%);
    }
}

/* BARRE */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    min-height:100px;
    display:flex;
    align-items:center;
    gap:25px;
    padding:10px 35px;
    background:rgba(7,9,16,.96);
    border-bottom:1px solid rgba(232,173,74,.18);
    box-shadow:0 7px 30px rgba(0,0,0,.40);
    backdrop-filter:blur(15px);
}

.logo{
    display:flex;
    align-items:center;
    flex-shrink:0;
}

.logo img{
    display:block;
    width:230px;
    height:82px;
    object-fit:contain;
}

.notes-button{
    padding:13px 20px;
    border:1px solid rgba(232,173,74,.35);
    border-radius:14px;
    background:rgba(232,173,74,.08);
    color:var(--gold-light);
    text-decoration:none;
    font-weight:800;
    transition:.25s;
}

.notes-button:hover{
    transform:translateY(-2px);
    background:var(--gold);
    color:#090a0d;
}

.top-search{
    position:relative;
    width:min(480px,50%);
    margin-left:auto;
}

.top-search input{
    width:100%;
    padding:14px 20px 14px 47px;
    border:1px solid rgba(232,173,74,.18);
    border-radius:30px;
    outline:none;
    font-size:15px;
    color:var(--cream);
    background:rgba(255,255,255,.065);
}

.top-search input::placeholder{
    color:var(--gray-dark);
}

.search-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    color:var(--gold);
}

/* PAGE */

.page{
    width:min(1550px,100%);
    margin:auto;
    padding:42px 35px;
}

.welcome h1{
    margin:0;
    font-size:clamp(32px,4vw,50px);
    letter-spacing:-1.5px;
    background:linear-gradient(90deg,var(--cream),var(--gold),var(--gold-dark));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.welcome p{
    margin-top:10px;
    color:var(--gray);
    font-size:17px;
}

/* CATEGORIES */

.categories{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:21px 2px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.category{
    flex-shrink:0;
    padding:14px 20px;
    border-radius:16px;
    border:1px solid rgba(232,173,74,.18);
    background:rgba(255,255,255,.055);
    color:var(--cream);
    cursor:pointer;
    font-size:15px;
    transition:.25s;
}

.category:hover{
    transform:translateY(-3px);
    background:rgba(232,173,74,.10);
}

.category.active{
    color:#0b0b0c;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(420px,45%);
    gap:28px;
    align-items:start;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.section-title h2{
    margin:0;
    font-size:23px;
}

.count{
    color:var(--gray);
    font-size:14px;
}

/* RESTAURANTS */

.restaurant-card{
    margin-bottom:15px;
    padding:21px;
    border-radius:22px;
    background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
    border:1px solid rgba(232,173,74,.15);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 35px rgba(0,0,0,.30);
    cursor:pointer;
    transition:.30s;
}

.restaurant-card:hover{
    transform:translateY(-5px);
    border-color:rgba(232,173,74,.35);
}

.restaurant-card.hidden{display:none}

.restaurant-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.restaurant-name{
    margin-bottom:7px;
    font-size:20px;
    font-weight:800;
}

.address{
    margin-bottom:12px;
    color:var(--gray);
    font-size:14px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.tag{
    padding:6px 9px;
    border-radius:9px;
    background:rgba(232,173,74,.08);
    color:var(--gold-light);
    font-size:12px;
}

.rating{
    text-align:right;
    white-space:nowrap;
}

.rating-number{
    color:var(--gold);
    font-size:18px;
    font-weight:bold;
}

.rating-label{
    margin-top:4px;
    color:var(--gray);
    font-size:12px;
}

/* CARTE */

.map-container{
    position:sticky;
    top:115px;
    height:calc(100vh - 140px);
    min-height:550px;
    overflow:hidden;
    border-radius:25px;
    border:1px solid rgba(232,173,74,.18);
    box-shadow:0 15px 50px rgba(0,0,0,.40);
}

#map{
    width:100%;
    height:100%;
}

.custom-marker{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:45px;
    height:40px;
    padding:0 13px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:#090a0d;
    font-weight:900;
    font-size:11px;
    white-space:nowrap;
    border:3px solid var(--cream);
    box-shadow:0 5px 18px rgba(232,173,74,.40);
}

.leaflet-popup-content-wrapper{
    border-radius:16px;
    background:var(--black);
    color:var(--cream);
}

.leaflet-popup-tip{
    background:var(--black);
}

.popup-title{
    font-size:18px;
    font-weight:900;
}

.popup-address{
    margin-top:8px;
    color:var(--gray);
}

.popup-button{
    display:block;
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:#090a0d;
    text-align:center;
    text-decoration:none;
    font-weight:900;
}

.loading{
    padding:20px;
    text-align:center;
    color:var(--gray);
}

/* MOBILE */

@media(max-width:950px){
    .layout{
        grid-template-columns:1fr;
    }

    .map-container{
        position:relative;
        top:auto;
        order:2;
        height:450px;
        min-height:450px;
    }
}

@media(max-width:600px){
    .topbar{
        min-height:auto;
        flex-wrap:wrap;
        padding:8px 15px;
        gap:8px;
    }

    .logo{
        justify-content:center;
    }

    .logo img{
        width:190px;
        height:70px;
    }

    .notes-button{
        margin-left:auto;
        padding:10px 13px;
        font-size:13px;
    }

    .top-search{
        width:100%;
        margin:0;
        order:3;
    }

    .page{
        padding:30px 18px;
    }

    .restaurant-top{
        flex-direction:column;
    }

    .rating{
        text-align:left;
    }

    .map-container{
        height:400px;
        min-height:400px;
    }
}
</style>

</head>

<body>

<a

<div class="top-search">

    <p>

</section>

<div class="categories">

    <button class="category active" onclick="filtrer('tout',this)">

    <button class="category" onclick="filtrer('tacos',this)">

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const restaurants = [

    {id:"castel",nom:"Le Castel",adresse:"164 Bd de Saint-Marcel, 13011 Marseille",categories:["tacos","burger","budget"]},
    {id:"darko",nom:"Chez Darko",adresse:"175 Bd de Saint-Marcel, 13011 Marseille",categories:["tacos","burger"]},
    {id:"pasta-time",nom:"PASTA TIME",adresse:"183 Bd de Saint-Marcel, 13011 Marseille",categories:["pizza","budget"]},
    {id:"kyodai",nom:"Kyodai Sushi",adresse:"114 Bd de Saint-Marcel, 13011 Marseille",categories:["sushi","equilibre"]},
    {id:"mplaisir",nom:"M.Plaisir",adresse:"110 Bd de Saint-Marcel, 13011 Marseille",categories:["tacos","burger","pizza","budget"]},
    {id:"nath",nom:"Le petit creux de Nath",adresse:"271 Bd de Saint-Marcel, 13011 Marseille",categories:["budget"]},
    {id:"mckaren",nom:"Snack McKaren",adresse:"68 Bd de Saint-Marcel, 13011 Marseille",categories:["burger","tacos","kebab","budget"]},
    {id:"poulet-carre",nom:"O poulet carre Marseille",adresse:"73 Bd de Saint-Marcel, 13011 Marseille",categories:["poulet","budget"]},
    {id:"tacos-avenue",nom:"Tacos Avenue - La Valentine",adresse:"55 Rue de l'Audience, 13011 Marseille",categories:["tacos","budget"]},
    {id:"snack-factory",nom:"Snack Factory La Valentine",adresse:"106 Rue de l'Audience, 13011 Marseille",categories:["tacos","burger","budget"]},
    {id:"little-supreme",nom:"Little Supreme Tacos",adresse:"33 Bd de la Barasse, 13011 Marseille",categories:["tacos","budget"]},
    {id:"doy-doy",nom:"Doy Doy Kebab",adresse:"95 Bd de la Barasse, 13011 Marseille",categories:["kebab","budget"]},
    {id:"carthaji",nom:"Carthaji - La Valentine",adresse:"87 Bd de la Barasse, 13011 Marseille",categories:["tacos","burger"]},
    {id:"istanbul",nom:"Ô İstanbul Kebab",adresse:"148 Bd de la Valbarelle, 13011 Marseille",categories:["kebab","budget"]},
    {id:"tasty-crousty",nom:"Tasty Crousty",adresse:"546 Bd Mireille Lauze, 13011 Marseille",categories:["poulet","budget"]},
    {id:"planet-burger",nom:"Planet Burger",adresse:"546 Bd Mireille Lauze, 13011 Marseille",categories:["burger"]},
    {id:"planet-food",nom:"Planet Food",adresse:"49 Bd de Saint-Loup, 13010 Marseille",categories:["burger","tacos","kebab"]},
    {id:"kfc",nom:"KFC Marseille La Valentine",adresse:"54 Av. des Peintres Roux, 13011 Marseille",categories:["poulet","budget"]},
    {id:"burger-king-1",nom:"Burger King - Grand V",adresse:"Centre Commercial Grand V, Av. des Peintres Roux, 13011 Marseille",categories:["burger","budget"]},
    {id:"burger-king-2",nom:"Burger King - La Valentine",adresse:"10 Traverse de la Sablière, 13011 Marseille",categories:["burger","budget"]},
    {id:"mcdonalds",nom:"McDonald's La Valentine",adresse:"ZAC de La Valentine, Av. François Chardigny, 13011 Marseille",categories:["burger","poulet","budget"]},
    {id:"quick",nom:"Quick - La Valentine",adresse:"Centre Commercial La Valentine, Traverse de la Sablière, 13011 Marseille",categories:["burger","budget"]},
    {id:"pitaya",nom:"Pitaya Thaï Street Food",adresse:"8 Route de la Sablière, 13011 Marseille",categories:["equilibre"]},
    {id:"waffle",nom:"Waffle Factory",adresse:"La Galerie - Géant, Route de la Sablière, 13011 Marseille",categories:["budget"]},
    {id:"cafe-chaud",nom:"Café Chaud",adresse:"Grand V, Traverse de la Montre, 13011 Marseille",categories:["budget","equilibre"]},
    {id:"croissanterie",nom:"La Croissanterie",adresse:"Aire de La Pomme A50, 13011 Marseille",categories:["budget"]},
    {id:"storia",nom:"Storia Pizza",adresse:"9 Route d'Allauch, 13011 Marseille",categories:["pizza"]},
    {id:"intemporel",nom:"L'Intemporel Pizzeria Restaurant",adresse:"1 Av. de Vienne, 13011 Marseille",categories:["pizza"]},
    {id:"everest",nom:"L'Everest Pizza",adresse:"33 Av. de la Gare, 13011 Marseille",categories:["pizza","budget"]},
    {id:"snack-pomme",nom:"Snack de la Pomme",adresse:"63 Av. Emmanuel Allard, 13011 Marseille",categories:["burger","tacos","kebab"]},
    {id:"fit-bar",nom:"Fit Bar",adresse:"133 Route des Camoins, 13011 Marseille",categories:["equilibre"]},
    {id:"2j-sushi",nom:"2J Sushi",adresse:"5 Route des Trois Lucs à la Valentine, 13012 Marseille",categories:["sushi","equilibre"]},
    {id:"envie-burger",nom:"L'Envie du Burger",adresse:"1 Av. Jean Lombard, 13011 Marseille",categories:["burger"]}

];

let markers={};
let activeCategory="tout";
let searchText="";

const map=L.map("map").setView([43.295,5.475],14);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:"&copy; OpenStreetMap contributors",
        maxZoom:19
    }
).addTo(map);

function nomCategorie(c){
    return {
        tacos:"Tacos",
        burger:"Burger",
        pizza:"Pizza",
        sushi:"Sushi",
        kebab:"Kebab",
        poulet:"Poulet",
        equilibre:"Équilibré",
        budget:"Petit budget"
    }[c]||c;
}

function emojiCategorie(c){
    return {
        tacos:"🌯",
        burger:"🍔",
        pizza:"🍕",
        sushi:"🍣",
        kebab:"🥙",
        poulet:"🍗",
        equilibre:"🥗",
        budget:"💰"
    }[c]||"🍽️";
}

function afficherRestaurants(){

    const container=document.getElementById("restaurantsList");

    container.innerHTML="";

    restaurants.forEach(resto=>{

        const card=document.createElement("article");

        card.className="restaurant-card";

        card.dataset.id=resto.id;

        card.innerHTML=`
            <div class="restaurant-top">
                <div>
                    <div class="restaurant-name">
                        🍔 ${resto.nom}
                    </div>

                    <div class="address">
                        📍 ${resto.adresse}
                    </div>

                    <div class="tags">
                        ${resto.categories.map(c=>`
                            <span class="tag">
                                ${emojiCategorie(c)} ${nomCategorie(c)}
                            </span>
                        `).join("")}
                    </div>
                </div>

                <div class="rating">
                    <div class="rating-number">⭐ —</div>
                    <div class="rating-label">Pas encore noté</div>
                </div>
            </div>
        `;

        card.addEventListener("click",()=>{
            allerAuRestaurant(resto.id);
        });

        container.appendChild(card);
    });

    mettreAJourFiltres();
}

async function geocoderRestaurants(){

    for(const resto of restaurants){

        try{

            const url=
                "https://nominatim.openstreetmap.org/search?"+
                new URLSearchParams({
                    q:resto.adresse,
                    format:"json",
                    limit:"1",
                    countrycodes:"fr"
                });

            const response=await fetch(url);

            const data=await response.json();

            if(data.length){

                resto.lat=Number(data[0].lat);
                resto.lng=Number(data[0].lon);

                ajouterMarqueur(resto);
            }

            await new Promise(
                resolve=>setTimeout(resolve,1100)
            );

        }catch(error){
            console.error(error);
        }
    }

    ajusterCarte();
}

function ajouterMarqueur(resto){

    if(!Number.isFinite(resto.lat))return;

    const icon=L.divIcon({
        className:"",
        html:`<div class="custom-marker">${resto.nom}</div>`,
        iconSize:null,
        iconAnchor:[0,20],
        popupAnchor:[0,-20]
    });

    const marker=L.marker(
        [resto.lat,resto.lng],
        {icon}
    );

    marker.bindPopup(`
        <div>
            <div class="popup-title">
                ${resto.nom}
            </div>

            <div class="popup-address">
                📍 ${resto.adresse}
            </div>

            <a
                class="popup-button"
                target="_blank"
                href="https://www.google.com/maps/dir/?api=1&destination=${resto.lat},${resto.lng}"
            >
                🚶 ITINÉRAIRE
            </a>
        </div>
    `);

    markers[resto.id]=marker;

    marker.addTo(map);
}

function ajusterCarte(){

    const positions=restaurants
        .filter(r=>Number.isFinite(r.lat))
        .map(r=>[r.lat,r.lng]);

    if(!positions.length)return;

    map.fitBounds(
        L.latLngBounds(positions),
        {padding:[40,40]}
    );
}

function allerAuRestaurant(id){

    const resto=restaurants.find(r=>r.id===id);

    if(!resto || !Number.isFinite(resto.lat)){
        return;
    }

    map.flyTo(
        [resto.lat,resto.lng],
        17,
        {duration:1.2}
    );

    setTimeout(()=>{
        if(markers[id]){
            markers[id].openPopup();
        }
    },500);
}

function filtrer(categorie,bouton){

    activeCategory=categorie;

    document
        .querySelectorAll(".category")
        .forEach(el=>el.classList.remove("active"));

    bouton.classList.add("active");

    mettreAJourFiltres();
}

function mettreAJourFiltres(){

    const cards=document.querySelectorAll(".restaurant-card");

    let compteur=0;

    cards.forEach(card=>{

        const resto=restaurants.find(
            r=>r.id===card.dataset.id
        );

        if(!resto)return;

        const categorieOK=
            activeCategory==="tout" ||
            resto.categories.includes(activeCategory);

        const rechercheOK=
            searchText==="" ||
            resto.nom.toLowerCase().includes(searchText) ||
            resto.adresse.toLowerCase().includes(searchText);

        const visible=categorieOK&&rechercheOK;

        card.classList.toggle("hidden",!visible);

        if(visible){
            compteur++;

            if(markers[resto.id]&&!map.hasLayer(markers[resto.id])){
                markers[resto.id].addTo(map);
            }
        }else{
            if(markers[resto.id]&&map.hasLayer(markers[resto.id])){
                map.removeLayer(markers[resto.id]);
            }
        }
    });

    document.getElementById("count").textContent=
        compteur+(compteur>1?" restaurants":" restaurant");
}

document.getElementById("searchInput").addEventListener(
    "input",
    function(){
        searchText=this.value.toLowerCase().trim();
        mettreAJourFiltres();
    }
);

/* ANIMATION VERS LES NOTES */

document.getElementById("notesButton").addEventListener(
    "click",
    function(event){

        event.preventDefault();

        const destination=this.href;

        document.body.classList.add("page-leaving");

        setTimeout(()=>{
            window.location.href=destination;
        },400);
    }
);

afficherRestaurants();
geocoderRestaurants();

window.addEventListener("load",()=>{
    setTimeout(()=>{
        map.invalidateSize();
    },500);
});

</script>

</body>
