<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuiRégale ?</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

:root {

    --black: #070910;
    --black-soft: #0b0e18;

    --navy: #111a35;
    --navy-light: #1a2545;

    --gold: #e8ad4a;
    --gold-light: #f5cf82;
    --gold-dark: #b87922;

    --cream: #f5f0e6;

    --gray: #cbd0d8;
    --gray-dark: #8d95a5;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:
        var(--cream);

    background:

        radial-gradient(
            circle at 10% 5%,
            rgba(232,173,74,.11),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(37,54,105,.30),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            var(--black),
            var(--navy)
        );

    background-attachment: fixed;
}


/* =========================================================
   BARRE DU HAUT
========================================================= */

.topbar {

    position: sticky;

    top: 0;

    z-index: 1000;

    min-height: 90px;

    display: flex;

    align-items: center;

    gap: 25px;

    padding: 10px 35px;

    background:
        rgba(7,9,16,.96);

    border-bottom:
        1px solid
        rgba(232,173,74,.18);

    box-shadow:
        0 7px 30px
        rgba(0,0,0,.40);

    backdrop-filter:
        blur(15px);
}


/* =========================================================
   LOGO DU HAUT
========================================================= */

.logo {

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    text-decoration: none;
}


.logo img {

    display: block;

    width: 205px;

    height: 75px;

    object-fit: contain;

    object-position: center;
}


/* =========================================================
   RECHERCHE
========================================================= */

.top-search {

    position: relative;

    width:
        min(480px,50%);

    margin-left: auto;
}


.top-search input {

    width: 100%;

    padding:
        14px
        20px
        14px
        47px;

    border:
        1px solid
        rgba(232,173,74,.18);

    border-radius: 30px;

    outline: none;

    font-size: 15px;

    color: var(--cream);

    background:
        rgba(255,255,255,.065);

    transition: .25s;
}


.top-search input::placeholder {

    color:
        var(--gray-dark);
}


.top-search input:focus {

    background:
        rgba(255,255,255,.10);

    border-color:
        var(--gold);

    box-shadow:
        0 0 0 4px
        rgba(232,173,74,.09);
}


.search-icon {

    position: absolute;

    left: 17px;

    top: 50%;

    transform:
        translateY(-50%);

    color:
        var(--gold);

    font-size: 17px;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    width:
        min(1550px,100%);

    margin: auto;

    padding:
        42px 35px;
}


/* =========================================================
   LOGO ACCUEIL
========================================================= */

.home-logo {

    display: flex;

    justify-content: center;

    align-items: center;

    margin:
        10px 0 25px;

    animation:
        logoAppear
        .8s
        ease;
}


.home-logo img {

    width:
        min(430px,85vw);

    height:
        auto;

    max-height:
        220px;

    object-fit:
        contain;

    filter:
        drop-shadow(
            0 15px 35px
            rgba(0,0,0,.35)
        );

    transition:
        .3s;
}


.home-logo img:hover {

    transform:
        scale(1.03);

    filter:
        drop-shadow(
            0 20px 45px
            rgba(232,173,74,.20)
        );
}


/* =========================================================
   ACCUEIL
========================================================= */

.welcome {

    text-align: center;

    animation:
        welcomeAppear
        .7s
        ease;
}


.welcome h1 {

    margin: 0;

    font-size:
        clamp(
            32px,
            4vw,
            50px
        );

    letter-spacing:
        -1.5px;

    background:
        linear-gradient(
            90deg,
            var(--cream),
            var(--gold),
            var(--gold-dark)
        );

    -webkit-background-clip:
        text;

    -webkit-text-fill-color:
        transparent;
}


.welcome p {

    margin-top: 10px;

    color:
        var(--gray);

    font-size: 17px;
}


/* =========================================================
   CATÉGORIES
========================================================= */

.categories {

    display: flex;

    gap: 12px;

    overflow-x: auto;

    padding: 21px 2px;

    scrollbar-width: none;

    animation:
        categoriesAppear
        .8s
        ease;
}


.categories::-webkit-scrollbar {
    display: none;
}


.category {

    flex-shrink: 0;

    padding:
        14px 20px;

    border-radius: 16px;

    border:
        1px solid
        rgba(232,173,74,.18);

    background:
        rgba(255,255,255,.055);

    color:
        var(--cream);

    cursor:
        pointer;

    font-size: 15px;

    backdrop-filter:
        blur(10px);

    transition: .25s;
}


.category:hover {

    transform:
        translateY(-3px)
        scale(1.02);

    background:
        rgba(232,173,74,.10);

    border-color:
        rgba(232,173,74,.42);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);
}


.category.active {

    color:
        #0b0b0c;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold-dark)
        );

    border-color:
        transparent;

    box-shadow:
        0 8px 25px
        rgba(232,173,74,.24);
}


/* =========================================================
   LAYOUT
========================================================= */

.layout {

    display: grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(420px,45%);

    gap: 28px;

    align-items:
        start;
}


/* =========================================================
   TITRE SECTION
========================================================= */

.section-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 16px;
}


.section-title h2 {

    margin: 0;

    font-size: 23px;

    color:
        var(--cream);
}


.count {

    color:
        var(--gray);

    font-size: 14px;
}


/* =========================================================
   CARTES RESTAURANTS
========================================================= */

.restaurant-card {

    margin-bottom: 15px;

    padding: 21px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.085),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(232,173,74,.15);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.30);

    cursor:
        pointer;

    transition: .30s;
}


.restaurant-card:hover {

    transform:
        translateY(-5px);

    background:
        linear-gradient(
            145deg,
            rgba(232,173,74,.10),
            rgba(255,255,255,.045)
        );

    border-color:
        rgba(232,173,74,.35);

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.40);
}


.restaurant-card.hidden {
    display: none;
}


.restaurant-card.show {

    animation:
        restaurantAppear
        .45s
        cubic-bezier(.2,.8,.2,1)
        both;
}


.restaurant-top {

    display: flex;

    justify-content:
        space-between;

    gap: 20px;
}


.restaurant-name {

    margin-bottom: 7px;

    font-size: 20px;

    font-weight: 800;

    color:
        var(--cream);
}


.address {

    margin-bottom: 12px;

    color:
        var(--gray);

    font-size: 14px;
}


.tags {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}


.tag {

    padding:
        6px 9px;

    border-radius: 9px;

    background:
        rgba(232,173,74,.08);

    border:
        1px solid
        rgba(232,173,74,.11);

    color:
        var(--gold-light);

    font-size: 12px;
}


.rating {

    text-align: right;

    white-space: nowrap;
}


.rating-number {

    color:
        var(--gold);

    font-size: 18px;

    font-weight: bold;
}


.rating-label {

    margin-top: 4px;

    color:
        var(--gray);

    font-size: 12px;
}


/* =========================================================
   CARTE
========================================================= */

.map-container {

    position: sticky;

    top: 105px;

    height:
        calc(100vh - 130px);

    min-height: 550px;

    overflow: hidden;

    border-radius: 25px;

    border:
        1px solid
        rgba(232,173,74,.18);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.40);

    background:
        #10131c;
}


#map {

    width: 100%;

    height: 100%;
}


/* =========================================================
   MARQUEURS
========================================================= */

.custom-marker {

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 45px;

    height: 40px;

    padding:
        0 13px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold-dark)
        );

    color:
        #090a0d;

    font-weight: 900;

    font-size: 11px;

    white-space: nowrap;

    border:
        3px solid
        var(--cream);

    box-shadow:
        0 5px 18px
        rgba(232,173,74,.40);

    transition: .2s;
}


.custom-marker:hover {

    transform:
        scale(1.08);
}


/* =========================================================
   POPUP
========================================================= */

.leaflet-popup-content-wrapper {

    border-radius: 16px;

    background:
        var(--black);

    color:
        var(--cream);

    border:
        1px solid
        rgba(232,173,74,.25);
}


.leaflet-popup-tip {

    background:
        var(--black);
}


.leaflet-popup-content {

    min-width: 220px;

    margin: 16px;
}


.popup-title {

    color:
        var(--cream);

    font-size: 18px;

    font-weight: 900;
}


.popup-address {

    margin-top: 8px;

    color:
        var(--gray);

    line-height: 1.4;
}


.popup-rating {

    margin-top: 9px;

    color:
        var(--gold);

    font-weight: bold;
}


.popup-button {

    display: block;

    width: 100%;

    margin-top: 15px;

    padding:
        13px 16px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold-dark)
        );

    color:
        #090a0d;

    text-align: center;

    text-decoration: none;

    font-weight: 900;

    font-size: 14px;

    box-shadow:
        0 6px 18px
        rgba(232,173,74,.20);

    transition: .2s;
}


.popup-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(232,173,74,.35);
}


/* =========================================================
   CHARGEMENT
========================================================= */

.loading {

    padding: 20px;

    text-align: center;

    color:
        var(--gray);
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes welcomeAppear {

    from {
        opacity: 0;
        transform:
            translateY(-25px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


@keyframes logoAppear {

    from {
        opacity: 0;
        transform:
            translateY(-25px)
            scale(.92);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes categoriesAppear {

    from {
        opacity: 0;
        transform:
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


@keyframes restaurantAppear {

    from {
        opacity: 0;
        transform:
            translateY(18px)
            scale(.98);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:950px) {

    .layout {

        grid-template-columns: 1fr;
    }


    .map-container {

        position: relative;

        top: auto;

        order: 2;

        height: 450px;

        min-height: 450px;
    }
}


@media(max-width:600px) {

    .topbar {

        min-height: auto;

        flex-direction: column;

        align-items: stretch;

        padding:
            8px 15px;

        gap: 8px;
    }


    .logo {

        justify-content: center;
    }


    .logo img {

        width: 175px;

        height: 65px;
    }


    .top-search {

        width: 100%;

        margin: 0;
    }


    .page {

        padding:
            25px 18px;
    }


    .home-logo {

        margin-top: 0;

        margin-bottom: 15px;
    }


    .home-logo img {

        width:
            min(360px,90vw);

        max-height:
            180px;
    }


    .restaurant-top {

        flex-direction:
            column;
    }


    .rating {

        text-align:
            left;
    }


    .map-container {

        height: 400px;

        min-height: 400px;
    }
}

</style>

</head>

        <aside class="map-container">

    </div>

</main>

        id: "envie-burger",
        nom: "L'Envie du Burger",
        adresse: "1 Av. Jean Lombard, 13011 Marseille",
        categories: ["burger"]
    }

];


let markers = {};

let activeCategory = "tout";

let searchText = "";


const map =
    L.map("map")
        .setView(
            [43.295,5.475],
            14
        );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors",

        maxZoom: 19
    }
).addTo(map);


function nomCategorie(
    categorie
) {

    const noms = {

        tacos: "Tacos",
        burger: "Burger",
        pizza: "Pizza",
        sushi: "Sushi",
        kebab: "Kebab",
        poulet: "Poulet",
        equilibre: "Équilibré",
        budget: "Petit budget"

    };

    return noms[categorie]
        || categorie;
}


function emojiCategorie(
    categorie
) {

    const emojis = {

        tacos: "🌯",
        burger: "🍔",
        pizza: "🍕",
        sushi: "🍣",
        kebab: "🥙",
        poulet: "🍗",
        equilibre: "🥗",
        budget: "💰"

    };

    return emojis[categorie]
        || "🍽️";
}


function afficherRestaurants() {

    const container =
        document.getElementById(
            "restaurantsList"
        );

    container.innerHTML = "";


    restaurants.forEach(
        (resto,index) => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "restaurant-card show";


            card.dataset.id =
                resto.id;


            card.innerHTML = `

                <div class="restaurant-top">

                    <div>

                        <div class="restaurant-name">
                            🍔 ${resto.nom}
                        </div>

                        <div class="address">
                            📍 ${resto.adresse}
                        </div>

                        <div class="tags">

                            ${resto.categories
                                .map(
                                    categorie =>
                                    `
                                    <span class="tag">
                                        ${emojiCategorie(categorie)}
                                        ${nomCategorie(categorie)}
                                    </span>
                                    `
                                )
                                .join("")
                            }

                        </div>

                    </div>


                    <div class="rating">

                        <div class="rating-number">
                            ⭐ —
                        </div>

                        <div class="rating-label">
                            Pas encore noté
                        </div>

                    </div>

                </div>
            `;


            card.style.animationDelay =
                `${Math.min(index*.025,.7)}s`;


            card.addEventListener(
                "click",
                () => {

                    allerAuRestaurant(
                        resto.id
                    );

                }
            );


            container.appendChild(
                card
            );

        }
    );


    mettreAJourFiltres();
}


function attendre(
    millisecondes
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                millisecondes
            )
    );
}


async function geocoderRestaurants() {

    for (
        const resto of restaurants
    ) {

        try {

            const url =
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({

                    q:
                        resto.adresse,

                    format:
                        "json",

                    limit:
                        "1",

                    countrycodes:
                        "fr"

                });


            const response =
                await fetch(
                    url,
                    {
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            const data =
                await response.json();


            if (
                data &&
                data.length > 0
            ) {

                resto.lat =
                    Number(
                        data[0].lat
                    );

                resto.lng =
                    Number(
                        data[0].lon
                    );


                ajouterMarqueur(
                    resto
                );
            }


            await attendre(1100);

        }

        catch(error) {

            console.error(
                "Erreur pour",
                resto.nom,
                error
            );

        }

    }


    ajusterCarte();
}


function ajouterMarqueur(
    resto
) {

    if (
        !Number.isFinite(resto.lat)
        ||
        !Number.isFinite(resto.lng)
    ) {
        return;
    }


    const icon =
        L.divIcon({

            className: "",

            html:
                `
                <div class="custom-marker">
                    ${resto.nom}
                </div>
                `,

            iconSize: null,

            iconAnchor:
                [0,20],

            popupAnchor:
                [0,-20]

        });


    const marker =
        L.marker(
            [
                resto.lat,
                resto.lng
            ],
            {
                icon
            }
        );


    marker.bindPopup(`

        <div>

            <div class="popup-title">
                ${resto.nom}
            </div>

            <div class="popup-address">
                📍 ${resto.adresse}
            </div>

            <div class="popup-rating">
                ⭐ Pas encore noté sur QuiRégale
            </div>

            <a
                class="popup-button"
                target="_blank"
                href="https://www.google.com/maps/dir/?api=1&destination=${resto.lat},${resto.lng}"
            >
                🚶 ITINÉRAIRE
            </a>

        </div>

    `);


    markers[resto.id] =
        marker;


    marker.addTo(map);
}


function ajusterCarte() {

    const positions =
        restaurants
            .filter(
                resto =>
                    Number.isFinite(
                        resto.lat
                    )
            )
            .map(
                resto =>
                    [
                        resto.lat,
                        resto.lng
                    ]
            );


    if (
        positions.length === 0
    ) {
        return;
    }


    const bounds =
        L.latLngBounds(
            positions
        );


    map.fitBounds(
        bounds,
        {
            padding:
                [40,40]
        }
    );
}


function allerAuRestaurant(
    id
) {

    const resto =
        restaurants.find(
            restaurant =>
                restaurant.id === id
        );


    if (!resto) {
        return;
    }


    if (
        !Number.isFinite(
            resto.lat
        )
    ) {

        alert(
            "La position de ce restaurant est encore en cours de chargement."
        );

        return;
    }


    map.flyTo(
        [
            resto.lat,
            resto.lng
        ],
        17,
        {
            duration: 1.2
        }
    );


    setTimeout(
        () => {

            if (
                markers[id]
            ) {

                markers[id]
                    .openPopup();
            }

        },
        500
    );
}


function filtrer(
    categorie,
    bouton
) {

    activeCategory =
        categorie;


    document
        .querySelectorAll(
            ".category"
        )
        .forEach(
            element =>
                element.classList
                    .remove("active")
        );


    bouton.classList.add(
        "active"
    );


    mettreAJourFiltres();
}


function mettreAJourFiltres() {

    const cards =
        document.querySelectorAll(
            ".restaurant-card"
        );


    let compteur = 0;


    cards.forEach(
        card => {

            const id =
                card.dataset.id;


            const resto =
                restaurants.find(
                    r =>
                        r.id === id
                );


            if (!resto) {
                return;
            }


            const correspondCategorie =
                activeCategory === "tout"
                ||
                resto.categories.includes(
                    activeCategory
                );


            const correspondRecherche =
                searchText === ""
                ||
                resto.nom
                    .toLowerCase()
                    .includes(searchText)
                ||
                resto.adresse
                    .toLowerCase()
                    .includes(searchText);


            const visible =
                correspondCategorie
                &&
                correspondRecherche;


            if (visible) {

                card.classList.remove(
                    "hidden"
                );

                compteur++;


                if (
                    markers[id]
                    &&
                    !map.hasLayer(
                        markers[id]
                    )
                ) {

                    markers[id]
                        .addTo(map);
                }

            }

            else {

                card.classList.add(
                    "hidden"
                );


                if (
                    markers[id]
                    &&
                    map.hasLayer(
                        markers[id]
                    )
                ) {

                    map.removeLayer(
                        markers[id]
                    );
                }

            }

        }
    );


    document
        .getElementById(
            "count"
        )
        .textContent =
            compteur +
            (
                compteur > 1
                    ? " restaurants"
                    : " restaurant"
            );
}


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            searchText =
                this.value
                    .toLowerCase()
                    .trim();


            mettreAJourFiltres();

        }
    );


afficherRestaurants();

geocoderRestaurants();


window.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                map.invalidateSize();

            },
            500
        );

    }
);

</script>

</body>

</html>
