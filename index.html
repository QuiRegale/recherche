<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuiRégale ?</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff7ed;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #f97316;
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        .boutons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 350px;
            margin: 30px auto;
        }

        button {
            padding: 18px;
            border: none;
            border-radius: 15px;
            background-color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 3px 10px #ddd;
        }

        button:hover {
            background-color: #ffedd5;
        }
    </style>
</head>

<body>

    <h1>🍔 QuiRégale ?</h1>

    <p>Tu veux manger quoi aujourd'hui ?</p>

    <div class="boutons">
        <button>🌯 Tacos</button>
        <button>🍔 Burger</button>
        <button>🌮 Kebab</button>
        <button>🍕 Pizza</button>
        <button>🥗 Manger équilibré</button>
    </div>

</body>
</html>
