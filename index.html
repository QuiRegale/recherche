   PAGE
========================================================= */

========================================================= */

.categories::-webkit-scrollbar {

}


.category {

        15px;

/* =========================================================

    "map"

/* OpenStreetMap */

/* =========================================================
   CRÉATION DES CARTES RESTAURANTS
========================================================= */

function afficherRestaurants() {

    const container =
        document.getElementById(
            "restaurantsList"
        );


    container.innerHTML = "";


    restaurants.forEach(
        (resto,index) => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "restaurant-card show";


            card.dataset.id =
                resto.id;


            card.dataset.categories =
                resto.categories.join(" ");


            card.innerHTML = `

                <div class="restaurant-top">

                    <div>

                        <div class="restaurant-name">
                            🍔 ${resto.nom}
                        </div>

                        <div class="address">
                            📍 ${resto.adresse}
                        </div>

                        <div class="tags">

                            ${resto.categories
                                .map(
                                    categorie =>
                                        `
                                        <span class="tag">
                                            ${emojiCategorie(categorie)}
                                            ${nomCategorie(categorie)}
                                        </span>
                                        `
                                )
                                .join("")
                            }

                        </div>

                    </div>


                    <div class="rating">

                        <div class="rating-number">
                            ⭐ —
                        </div>

                        <div class="rating-label">
                            Pas encore noté
                        </div>

                    </div>

                </div>

            `;


            card.style.animationDelay =
                `${Math.min(index * .025,.7)}s`;


            card.addEventListener(
                "click",
                () => {

                    allerAuRestaurant(
                        resto.id
                    );

                }
            );


            container.appendChild(
                card
            );

        }
    );


    mettreAJourFiltres();

}


/* =========================================================
   NOMS DES CATÉGORIES
========================================================= */

    categorie
) {

    const noms = {

        tacos:
            "Tacos",

}

) {

/* =========================================================
   GÉOCODAGE
=========================================================

   On demande à OpenStreetMap les coordonnées correspondant
   aux adresses.

   Les requêtes sont faites une par une pour éviter de
   surcharger le service.
========================================================= */

async function geocoderRestaurants() {

    for (
        const resto of restaurants
    ) {

        try {

            const url =
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({

                    q:
                        resto.adresse,

                    format:
                        "json",

                    limit:
                        "1",

                    countrycodes:
                        "fr"

                });


            const response =
                await fetch(
                    url,
                    {
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            const data =
                await response.json();


            if (
                data &&
                data.length > 0
            ) {

                resto.lat =
                    Number(
                        data[0].lat
                    );

                resto.lng =
                    Number(
                        data[0].lon
                    );


                ajouterMarqueur(
                    resto
                );

            }


            /*
             Petite pause entre les requêtes.
             */

            await attendre(
                1100
            );

        }

        catch(error) {

            console.error(
                "Erreur pour",
                resto.nom,
                error
            );

        }

    }


    /*
    Une fois les positions récupérées,
    on ajuste la carte.
    */

    ajusterCarte();

}


/* =========================================================
   ATTENDRE
========================================================= */

function attendre(
    millisecondes
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                millisecondes
            )
    );

}


/* =========================================================
   MARQUEUR
========================================================= */

function ajouterMarqueur(
    resto
) {

    if (
        !Number.isFinite(
            resto.lat
        )
        ||
        !Number.isFinite(
            resto.lng
        )
    ) {

        return;

    }


    const icon =
        L.divIcon({

            className:
                "",

            html:
                `
                <div class="custom-marker">
                    ${resto.nom}
                </div>
                `,

            iconSize:
                null,

            iconAnchor:
                [0,20],

            popupAnchor:
                [0,-20]

        });


    const marker =
        L.marker(
            [
                resto.lat,
                resto.lng
            ],
            {
                icon:
                    icon
            }
        );


    marker.bindPopup(`

        <div>

            <div class="popup-title">
                ${resto.nom}
            </div>

            <div class="popup-address">
                📍 ${resto.adresse}
            </div>

            <div class="popup-rating">
                ⭐ Pas encore noté sur QuiRégale
            </div>

            <a
                class="popup-button"
                target="_blank"
                href="https://www.google.com/maps/dir/?api=1&destination=${resto.lat},${resto.lng}"
            >
                🚶 ITINÉRAIRE
            </a>

        </div>

    `);


    markers[
        resto.id
    ] =
        marker;


    marker.addTo(
        map
    );

}


/* =========================================================
   AJUSTER LA CARTE
========================================================= */

function ajusterCarte() {

    const positions =
        restaurants
        .filter(
            resto =>
                Number.isFinite(
                    resto.lat
                )
        )
        .map(
            resto =>
                [
                    resto.lat,
                    resto.lng
                ]
        );


    if (
        positions.length === 0
    ) {

        return;

    }


    const bounds =
        L.latLngBounds(
            positions
        );


    map.fitBounds(
        bounds,
        {
            padding:
                [40,40]
        }
    );

}


/* =========================================================
   ALLER À UN RESTAURANT
========================================================= */

function allerAuRestaurant(
    id
) {

    const resto =
        restaurants.find(
            restaurant =>
                restaurant.id === id
        );


    if (!resto) {
        return;
    }


    /*
    Si le restaurant n'est pas encore
    géocodé, on ne fait rien.
    */

    if (
        !Number.isFinite(
            resto.lat
        )
    ) {

        alert(
            "La position de ce restaurant est encore en cours de chargement."
        );

        return;

    }


    map.flyTo(
        [
            resto.lat,
            resto.lng
        ],
        17,
        {
            duration:
                1.2
        }
    );


    setTimeout(
        () => {

            if (
                markers[id]
            ) {

                markers[id]
                    .openPopup();

            }

        },
        500
    );

}


/* =========================================================
   FILTRES
========================================================= */

function filtrer(
    categorie,
    bouton
) {

    activeCategory =
        categorie;


    document
        .querySelectorAll(
            ".category"
        )
        .forEach(
            element =>
                element.classList
                    .remove(
                        "active"
                    )
        );


    bouton.classList.add(
        "active"
    );


    mettreAJourFiltres();

}


/* =========================================================
   FILTRES + RECHERCHE
========================================================= */

function mettreAJourFiltres() {

    const cards =
        document.querySelectorAll(
            ".restaurant-card"
        );


    let compteur =
        0;


    cards.forEach(
        card => {

            const id =
                card.dataset.id;


            const resto =
                restaurants.find(
                    r =>
                        r.id === id
                );


            if (!resto) {
                return;
            }


            const correspondCategorie =
                activeCategory === "tout"
                ||
                resto.categories.includes(
                    activeCategory
                );


            const correspondRecherche =
                searchText === ""
                ||
                (
                    resto.nom
                    .toLowerCase()
                    .includes(
                        searchText
                    )
                    ||
                    resto.adresse
                    .toLowerCase()
                    .includes(
                        searchText
                    )
                );


            const visible =
                correspondCategorie
                &&
                correspondRecherche;


            if (visible) {

                card.classList.remove(
                    "hidden"
                );

                compteur++;


                if (
                    markers[id]
                    &&
                    !map.hasLayer(
                        markers[id]
                    )
                ) {

                    markers[id]
                        .addTo(map);

                }

            }

            else {

                card.classList.add(
                    "hidden"
                );


                if (
                    markers[id]
                    &&
                    map.hasLayer(
                        markers[id]
                    )
                ) {

                    map.removeLayer(
                        markers[id]
                    );

                }

            }

        }
    );


    document
        .getElementById(
            "count"
        )
        .textContent =
            compteur +
            (
                compteur > 1
                    ? " restaurants"
                    : " restaurant"
            );

}


/* =========================================================
   RECHERCHE
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            searchText =
                this.value
                .toLowerCase()
                .trim();


            mettreAJourFiltres();

        }
    );


/* =========================================================
   LANCEMENT
========================================================= */

afficherRestaurants();


geocoderRestaurants();


/* =========================================================
   RESPONSIVE MAP
========================================================= */

window.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                map.invalidateSize();

            },
            500
        );

    }
);

</script>
